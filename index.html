<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        document.querySelector('meta[name="color-scheme"]').content =
          localStorage.getItem("color-scheme") ?? "light dark";
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/V.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Primary Meta Tags -->
    <title>Adebayo Peter | Frontend & Mobile Developer</title>
    <meta name="title" content="Adebayo Peter | Frontend & Mobile Developer" />
    <meta
      name="description"
      content="Adebayo Peter is a skilled frontend and mobile application developer with expertise in building responsive web applications utilizing tools like React, Next.js, Tailwind CSS, and modern JavaScript frameworks, as well as creating cross-platform mobile applications with React Native."
    />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://adebayo-peter-portfolio.vercel.app/" />
    <meta property="og:title" content="Adebayo Peter | Frontend & Mobile Developer" />
    <meta
      property="og:description"
      content="Adebayo Peter is a skilled frontend and mobile application developer building modern web apps with React & Next.js and mobile apps with React Native."
    />
    <meta property="og:image" content="/My-picture.png" />
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://adebayo-peter-portfolio.vercel.app/" />
    <meta property="twitter:title" content="Adebayo Peter | Frontend & Mobile Developer" />
    <meta
      property="twitter:description"
      content="Adebayo Peter is a skilled frontend and mobile application developer building modern web apps with React & Next.js and mobile apps with React Native."
    />
    <meta property="twitter:image" content="/My-picture.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
